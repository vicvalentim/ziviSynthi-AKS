name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: C, Web Studio and DSP regression
        run: make -j2 test

  research-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate citation files
        run: |
          python -m pip install cffconvert==2.0.0
          cffconvert --validate
          python tools/check_scientific_metadata.py
      - name: Generate both site editions with the archived downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          tag="$(python -c 'import json; print("v" + json.load(open("codemeta.json"))["version"])')"
          gh release download "$tag" --repo vicvalentim/ziviSynthi-AKS --dir build/published
          python tools/stage_github_pages.py build/published build/pages --published \
            --site https://vicvalentim.github.io/ziviSynthi-AKS/ --source https://github.com/vicvalentim/ziviSynthi-AKS
          (cd build/pages && sha256sum -c PAGES-SHA256SUMS.txt)

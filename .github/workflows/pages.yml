name: Publish ziviSynthi AKS to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      pages: read
    env:
      ZIVI_JIELI_ARCHIVE_URL: ${{ vars.ZIVI_JIELI_ARCHIVE_URL }}
      ZIVI_AC79_GIT_URL: ${{ vars.ZIVI_AC79_GIT_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        id: pages
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Build and verify the SMK-37 Pro artifacts
        run: |
          python -m pip install Pillow==13.0.0
          tools/build_github.sh smk37-pro
      - name: Install the documentation renderer
        run: |
          if ! command -v pandoc >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y pandoc
          fi
      - name: Assemble the home, documentation, editor and downloads
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python tools/stage_github_pages.py dist/smk37-pro build/pages \
            --site "$PAGES_URL" --source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          (cd build/pages && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: publish

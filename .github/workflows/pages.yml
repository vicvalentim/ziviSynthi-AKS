name: Publish ziviSynthi AKS to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      publish_new_release:
        description: Build and publish a new pre-release
        type: boolean
        default: false

env:
  PRERELEASE_VERSION: '3.9.7'

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      pages: read
    env:
      ZIVI_JIELI_ARCHIVE_URL: ${{ vars.ZIVI_JIELI_ARCHIVE_URL }}
      ZIVI_AC79_GIT_URL: ${{ vars.ZIVI_AC79_GIT_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        id: pages
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: inputs.publish_new_release
        with:
          node-version: "24"
      - name: Build and verify the SMK-37 Pro artifacts
        if: inputs.publish_new_release
        run: |
          python -m pip install Pillow==13.0.0
          tools/build_github.sh smk37-pro
      - name: Download the original release assets
        if: "!inputs.publish_new_release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$PRERELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir build/published
      - name: Install the documentation renderer
        run: |
          if ! command -v pandoc >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y pandoc
          fi
      - name: Assemble the home, documentation, editor and downloads
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          NEW_RELEASE: ${{ inputs.publish_new_release }}
        run: |
          inputs=(build/published --published)
          if [[ "$NEW_RELEASE" == true ]]; then inputs=(dist/smk37-pro); fi
          python tools/stage_github_pages.py "${inputs[@]}" build/pages \
            --site "$PAGES_URL" --source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          (cd build/pages && sha256sum -c PAGES-SHA256SUMS.txt)
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/pages
      - name: Collect verified pre-release downloads
        if: inputs.publish_new_release && github.repository == 'vicvalentim/ziviSynthi-AKS'
        run: |
          mkdir -p build/release
          files=("zivisynthi-felucca-smk37-${PRERELEASE_VERSION}.fwsc" zivisynthi-aks-editor.html zivisynthi-aks-editor-pt.html
            firmware.json zivisynthi-aks-presets.zip zivisynthi-aks-source.zip)
          for file in "${files[@]}"; do cp "build/pages/$file" build/release/; done
          cd build/release
          sha256sum "${files[@]}" > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.publish_new_release && github.repository == 'vicvalentim/ziviSynthi-AKS'
        with:
          name: prerelease-assets
          path: build/release/
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: publish

  prerelease:
    if: inputs.publish_new_release && github.repository == 'vicvalentim/ziviSynthi-AKS'
    needs: deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prerelease-assets
          path: build/release
      - name: Publish the verified pre-release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${PRERELEASE_VERSION}"
          if gh release view "$tag" --json isDraft,isPrerelease > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            jq -e '.isPrerelease and (.isDraft | not)' "$RUNNER_TEMP/release.json" >/dev/null
            exit 0
          fi
          (cd build/release && sha256sum -c SHA256SUMS.txt)
          gh release create "$tag" build/release/* --target "$GITHUB_SHA" \
            --title "ziviSynthi AKS ${PRERELEASE_VERSION} · Pre-release" \
            --notes-file "docs/releases/$tag.md" --prerelease --latest=false
